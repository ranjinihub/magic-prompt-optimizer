<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Prompt Optimizer V2</title>
    <style>
        :root { --bg-dark: #090a0f; --card-bg: #11131c; --accent-purple: #7c4dff; --accent-green: #00e676; --text-light: #f5f6fa; --text-muted: #8b92b6; --border-color: #242736; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding: 32px 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        textarea, select { width: 100%; background-color: #0d0f16; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-light); padding: 16px; }
        textarea { height: 160px; }
        button { width: 100%; background: var(--accent-purple); border: none; border-radius: 8px; color: white; padding: 16px; font-weight: 600; cursor: pointer; }
        .output-box { background-color: #0d0f16; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; color: var(--accent-green); min-height: 150px; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
    <header><h2>Optimizer Pipeline V2</h2></header>
    <div class="card">
        <div class="form-group">
            <label>Raw Instruction Logic (Input)</label>
            <textarea id="rawPrompt" placeholder="Paste prompt here..."></textarea>
        </div>
        <div class="form-group">
            <label>Target Architecture</label>
            <select id="templateStyle">
                <option value="stateMachine">Convert to Finite State Machine (FSM)</option>
                <option value="developer">Defensive Pipeline (CI/CD Safe)</option>
            </select>
        </div>
        <button id="execBtn"><span id="btnText">COMPILE OPTIMIZATION</span></button>
    </div>
    <div class="card" id="outputCard" style="display: none;">
        <div class="form-group">
            <label>Compiled System Prompt</label>
            <div class="output-box" id="optimizedOutput"></div>
        </div>
    </div>
</div>

<script>
    const matrices = {
        stateMachine: (raw) => `# ROLE: Specialized FSM Engine\n\n# DIRECTIVE\nEvaluate context and lock into ONE discrete state per response. DO NOT execute multiple steps simultaneously.\n\n[STATE 1: INTAKE]\n- Condition: Missing parameters.\n- Action: Ask 1-2 questions. Halt.\n\n[STATE 2: GENERATION]\n- Condition: Constraints mapped.\n- Action: Provide 3 options. Halt.\n\n[STATE 3: DEEP DRILL]\n- Condition: User selects option.\n- Action: Expand details.\n\n# INPUT:\n"${raw}"`,
        developer: (raw) => `# ROLE: CI/CD Parser\n## CONSTRAINTS:\n- NO conversational preambles.\n- NO markdown unless requested.\n- Output raw data only.\n\n## INPUT:\n"${raw}"`
    };

    const execBtn = document.getElementById('execBtn');
    const outputBox = document.getElementById('optimizedOutput');
    const outputCard = document.getElementById('outputCard');
    let isGenerating = false;

    execBtn.addEventListener('click', () => {
        if (isGenerating) return;
        const rawInput = document.getElementById('rawPrompt').value.trim();
        const style = document.getElementById('templateStyle').value;
        outputCard.style.display = 'block';
        
        if (!rawInput) { outputBox.textContent = 'Error: Payload empty.'; return; }
        
        isGenerating = true; 
        outputBox.textContent = '';
        const compiledText = matrices[style](rawInput);
        let index = 0;
        
        function renderTick() {
            if (index < compiledText.length) {
                outputBox.textContent += compiledText.substring(index, index + 4);
                index += 4;
                requestAnimationFrame(renderTick);
            } else { isGenerating = false; }
        }
        requestAnimationFrame(renderTick);
    });
</script>
</body>
</html>
